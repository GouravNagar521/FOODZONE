<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FoodZone Admin{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            color: #222;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #191919;
            color: white;
            padding: 25px 18px;
            overflow-y: auto;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #f28c28;
            margin-bottom: 40px;
        }

        .logo span {
            color: white;
        }

        .sidebar a {
            display: block;
            color: #bbb;
            text-decoration: none;
            padding: 14px 15px;
            margin: 7px 0;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #f28c28;
            color: white;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
            min-height: 100vh;
        }

        @media(max-width:650px) {
            .sidebar {
                width: 65px;
                padding: 20px 8px;
            }

            .sidebar .logo {
                font-size: 0;
            }

            .sidebar .logo:first-letter {
                font-size: 24px;
            }

            .sidebar a {
                text-align: center;
                font-size: 0;
            }

            .sidebar a i {
                font-size: 18px;
            }

            .main {
                margin-left: 65px;
                padding: 15px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="sidebar">

    <div class="logo">Food<span>Zone.</span></div>

    <a href="{% url 'dashboard_home' %}"
       class="{% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">
        <i class="fas fa-home"></i> &nbsp; Dashboard
    </a>

    <a href="{% url 'dashboard_food_items' %}"
       class="{% if request.resolver_match.url_name == 'dashboard_food_items' or request.resolver_match.url_name == 'add_food' or request.resolver_match.url_name == 'edit_food' %}active{% endif %}">
        <i class="fas fa-hamburger"></i> &nbsp; Food Items
    </a>

    <a href="{% url 'dashboard_orders' %}"
       class="{% if request.resolver_match.url_name == 'dashboard_orders' %}active{% endif %}">
        <i class="fas fa-shopping-cart"></i> &nbsp; Orders
    </a>

    <a href="{% url 'dashboard_bookings' %}"
       class="{% if request.resolver_match.url_name == 'dashboard_bookings' %}active{% endif %}">
        <i class="fas fa-calendar"></i> &nbsp; Bookings
    </a>

    <a href="{% url 'dashboard_messages' %}"
       class="{% if request.resolver_match.url_name == 'dashboard_messages' %}active{% endif %}">
        <i class="fas fa-envelope"></i> &nbsp; Messages
    </a>

    <a href="/" target="_blank">
        <i class="fas fa-globe"></i> &nbsp; Visit Website
    </a>

</div>

<div class="main">

    {% block content %}
    {% endblock %}

</div>

{% block extra_js %}{% endblock %}

</body>
</html>
